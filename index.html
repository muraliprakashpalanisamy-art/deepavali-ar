<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deepavali AR Wish 🪔</title>
<style>
  html,body{
    margin:0;height:100%;overflow:hidden;background:#000;
    font-family:system-ui,Segoe UI,Arial,sans-serif;
  }
  #app{position:relative;height:100vh}
  #camera{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
    transform:none;                /* ✅ default: no mirror */
  }
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #gate{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(circle at center,#1a0033 0%,#000 90%);
    color:#fff;z-index:5;
  }
  input{
    padding:10px;border-radius:10px;border:none;width:70%;
    font-size:1rem;margin:10px 0;text-align:center;
  }
  button{
    padding:12px 20px;border:none;border-radius:10px;
    background:linear-gradient(90deg,#ff8a00,#e52e71);
    color:#fff;font-weight:600;cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="gate">
    <h2>🪔 Happy Deepavali 🪔</h2>
    <p>Enter your name to receive your personalized wish:</p>
    <input id="userName" placeholder="Your name here" />
    <button id="start">Let the lights in ✨</button>
  </div>
  <audio id="bgm" loop preload="auto">
    <source src="https://cdn.pixabay.com/audio/2023/10/22/audio_ee4f78ef3f.mp3" type="audio/mpeg">
  </audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const video=document.getElementById('camera');
const gate=document.getElementById('gate');
const startBtn=document.getElementById('start');
const canvas=document.getElementById('overlay');
const bgm=document.getElementById('bgm');
let renderer,scene,camera3D,lamp,flame,plane,particles,t=0;

startBtn.onclick=async()=>{
  const name=document.getElementById('userName').value.trim()||"Friend";
  gate.style.display='none';
  await startCamera();
  requestLocation();
  playMusic();
  startAR(name);
};

async function startCamera(){
  try{
    const devices=await navigator.mediaDevices.enumerateDevices();
    let rearCam=devices.find(d=>d.kind==="videoinput"&&/back|rear|environment/i.test(d.label));
    const constraints=rearCam?{video:{deviceId:rearCam.deviceId}}:{video:{facingMode:"environment"}};
    const stream=await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject=stream;

    // ✅ explicitly disable any mirroring CSS
    video.style.transform='none';
    // ✅ and disable automatic mirroring on some browsers
    video.style.webkitTransform='none';
  }catch(e){console.error(e);}
}

function playMusic(){
  bgm.volume=0.5;
  const tryPlay=()=>bgm.play().catch(()=>{});
  document.body.addEventListener('click',tryPlay,{once:true});
  document.body.addEventListener('touchstart',tryPlay,{once:true});
}

function requestLocation(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(
    pos=>console.log('Location:',pos.coords.latitude,pos.coords.longitude),
    err=>console.log('Location error:',err.message)
  );
}

function startAR(name){
  renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  scene=new THREE.Scene();
  camera3D=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
  camera3D.position.z=2;

  const texLamp=drawLotusLamp();
  lamp=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),
    new THREE.MeshBasicMaterial({map:texLamp,transparent:true}));
  lamp.position.set(0,-0.5,-1.2); scene.add(lamp);

  const texFlame=drawFlame();
  flame=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.4),
    new THREE.MeshBasicMaterial({map:texFlame,transparent:true,opacity:0.9}));
  flame.position.set(0,-0.2,-1.1); scene.add(flame);

  const texText=makeTextTexture(name);
  plane=new THREE.Mesh(new THREE.PlaneGeometry(1.8,0.9),
    new THREE.MeshBasicMaterial({map:texText,transparent:true}));
  plane.position.set(0,0.55,-1.1); scene.add(plane);

  const pGeo=new THREE.BufferGeometry(),N=150,p=new Float32Array(N*3);
  for(let i=0;i<N;i++){p[i*3]=(Math.random()-0.5)*3;p[i*3+1]=Math.random()*2-1;p[i*3+2]=-Math.random()*2;}
  pGeo.setAttribute('position',new THREE.BufferAttribute(p,3));
  particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffe066,size:0.02,transparent:true,opacity:0.9}));
  scene.add(particles);

  animate(); window.addEventListener('resize',resize);
}

function drawLotusLamp(){
  const c=document.createElement('canvas'); c.width=800;c.height=800;
  const ctx=c.getContext('2d');
  const grad=ctx.createRadialGradient(400,420,60,400,420,380);
  grad.addColorStop(0,'#ffb3c1'); grad.addColorStop(1,'#7a0c3a');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.ellipse(400,470,260,120,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8a1f1f'; ctx.beginPath(); ctx.ellipse(400,430,150,70,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#b43b3b'; ctx.beginPath(); ctx.ellipse(400,420,145,55,0,0,Math.PI*2); ctx.fill();
  return new THREE.CanvasTexture(c);
}

function drawFlame(){
  const c=document.createElement('canvas'); c.width=256;c.height=256;
  const ctx=c.getContext('2d');
  const flame=ctx.createRadialGradient(128,100,10,128,100,70);
  flame.addColorStop(0,'#fff8c1'); flame.addColorStop(1,'rgba(255,120,0,0)');
  ctx.fillStyle=flame;
  ctx.beginPath(); ctx.moveTo(128,30);
  ctx.quadraticCurveTo(168,100,128,160);
  ctx.quadraticCurveTo(88,100,128,30); ctx.fill();
  return new THREE.CanvasTexture(c);
}

function makeTextTexture(name){
  const c=document.createElement('canvas'); c.width=1400;c.height=650;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign='center';
  ctx.fillStyle='#3a0d0d';
  ctx.shadowColor='rgba(0,0,0,.3)'; ctx.shadowBlur=10;
  ctx.font='bold 66px Segoe UI';
  ctx.fillText('Happy Deepavali to '+name, c.width/2, 180);
  ctx.font='32px Segoe UI';
  ctx.fillText('May the light of Diwali fill your home with joy and prosperity.', c.width/2, 250);
  ctx.fillText('Wishing you and your loved ones a bright and blessed Deepavali.✨', c.width/2, 310);
  return new THREE.CanvasTexture(c);
}

function animate(){
  requestAnimationFrame(animate);
  t+=0.01;
  if(lamp)lamp.position.y=-0.5+Math.sin(t)*0.04;
  if(flame){flame.scale.y=1+Math.sin(t*20)*0.1;flame.material.opacity=0.8+Math.sin(t*15)*0.2;}
  if(plane)plane.rotation.y=Math.sin(t)*0.3;
  if(particles){
    const a=particles.geometry.attributes.position;
    for(let i=0;i<a.count;i++){let y=a.getY(i)+0.002;if(y>1.2)y=-1.2;a.setY(i,y);}
    a.needsUpdate=true;
  }
  renderer.render(scene,camera3D);
}

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera3D.aspect=innerWidth/innerHeight;
  camera3D.updateProjectionMatrix();
}
</script>
</body>
</html>
