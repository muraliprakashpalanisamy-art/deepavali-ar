<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deepavali AR Wish ✨</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #app { position: relative; height: 100vh; }

    /* Camera feed */
    #camera { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; transform: scaleX(1); }

    /* WebGL overlay */
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Welcome screen */
    #gate { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: radial-gradient(80vmax 80vmax at 50% 40%, #1a0033 0%, #000 70%); color: #fff; text-align: center; padding: 24px; }
    .panel { width: min(640px, 92vw); padding: 22px; border-radius: 16px; background: rgba(255,255,255,.06); backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.1); }
    .panel h2 { margin: 0 0 8px; font-size: clamp(22px, 4vw, 32px); }
    .panel p { margin: 0 0 14px; opacity: .9; }
    input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 0; font-size: 1rem; outline: none; background: rgba(255,255,255,.92); color: #1b1b1b; }
    button.primary { width: 100%; padding: 13px 18px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 700; background: linear-gradient(90deg,#ffb703,#fb5607); color: #2b0c05; box-shadow: 0 8px 22px rgba(251,86,7,.35); }
    .hint { font-size: 12px; opacity: .85; margin-top: 8px; }

    /* Controls */
    .controls { position: absolute; right: 12px; bottom: 12px; z-index: 7; display: flex; gap: 8px; align-items: center; }
    .ctrl { display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 999px; border: 0; cursor: pointer; font-weight: 600; background: rgba(255,255,255,.1); color: #fff; backdrop-filter: blur(8px); box-shadow: 0 4px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.15); }
    .ctrl[disabled] { opacity: .5; cursor: not-allowed; }

    /* Toast */
    .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 78px; background: rgba(0,0,0,.7); color:#fff; padding: 8px 12px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s ease; z-index: 8; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <!-- Name entry -->
    <div id="gate">
      <div class="panel">
        <h2>🪔 Happy Deepavali 🪔</h2>
        <p>Enter your name and tap Start to see your AR greeting.</p>
        <input id="userName" placeholder="Your name (e.g., Priya)" />
        <button id="start" class="primary">Start ✨</button>
        <div class="hint">Ensure you allow camera & location for full experience.</div>
      </div>
    </div>

    <!-- Floating controls -->
    <div class="controls">
      <button id="playPause" class="ctrl" aria-pressed="false" disabled>▶ Play</button>
      <button id="mute" class="ctrl" aria-pressed="false" disabled>🔈</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" disabled />
    </div>

    <div id="toast" class="toast" role="status"></div>

    <!-- 🎵 Updated: Plays your uploaded song -->
    <audio id="bgm" loop preload="auto">
      <source id="bgmSource" src="Mangalam%20Oli%20Veesum%20Deepavali__Video%20Song__Vdj%20Yuva__Deepavali%20Special.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  const video = document.getElementById('camera');
  const startBtn = document.getElementById('start');
  const gate = document.getElementById('gate');
  const bgm = document.getElementById('bgm');
  const playPause = document.getElementById('playPause');
  const muteBtn = document.getElementById('mute');
  const vol = document.getElementById('volume');
  const toast = document.getElementById('toast');
  const canvas = document.getElementById('overlay');
  let renderer, scene, cam3D, plane, glow, particles, t = 0;

  function showToast(text, ms=1800){
    toast.textContent=text;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),ms);
  }

  startBtn.onclick = async () => {
    const name = document.getElementById('userName').value.trim() || "Friend";
    gate.style.display = 'none';
    await startCamera();
    requestLocation();
    setupAR(name);
    setupMusic();
  };

  async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream;
    video.style.transform = 'scaleX(1)';
  }

  function requestLocation(){
    if(!navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(
      pos=>console.log('Location:',pos.coords.latitude,pos.coords.longitude),
      err=>console.warn('Location denied:',err.message)
    );
  }

  function setupMusic(){
    bgm.volume = vol.valueAsNumber;
    bgm.play().catch(()=>showToast("Tap ▶ Play to start music"));
    playPause.disabled = false;
    muteBtn.disabled = false;
    vol.disabled = false;

    playPause.onclick = async ()=>{
      if(bgm.paused){ await bgm.play(); playPause.textContent='⏸ Pause'; }
      else{ bgm.pause(); playPause.textContent='▶ Play'; }
    };
    muteBtn.onclick = ()=>{
      bgm.muted = !bgm.muted;
      muteBtn.textContent = bgm.muted ? '🔇' : '🔈';
    };
    vol.oninput = ()=>{ if(!bgm.muted) bgm.volume = vol.valueAsNumber; };
  }

  function setupAR(name){
    renderer = new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    scene = new THREE.Scene();
    cam3D = new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
    cam3D.position.z = 1.6;

    const tex = makeWishTexture(name);
    const geo = new THREE.PlaneGeometry(1.9,0.8);
    const mat = new THREE.MeshBasicMaterial({map:tex,transparent:true});
    plane = new THREE.Mesh(geo,mat); plane.position.z = -1.2; scene.add(plane);

    const ringGeo = new THREE.RingGeometry(0.8,1.15,64);
    const ringMat = new THREE.MeshBasicMaterial({color:0xffc107,transparent:true,opacity:0.32,side:THREE.DoubleSide});
    glow = new THREE.Mesh(ringGeo,ringMat); glow.position.z=-1.3; scene.add(glow);

    const pGeo=new THREE.BufferGeometry(); const N=140; const pPos=new Float32Array(N*3);
    for(let i=0;i<N;i++){pPos[i*3]=(Math.random()-0.5)*3;pPos[i*3+1]=Math.random()*2-1;pPos[i*3+2]=-Math.random()*2;}
    pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
    particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffe066,size:0.02,transparent:true,opacity:0.85}));
    scene.add(particles);

    animate(); window.addEventListener('resize',resize);
  }

  function makeWishTexture(name){
    const c=document.createElement('canvas'); c.width=1024;c.height=512;
    const ctx=c.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,1024,512);
    grad.addColorStop(0,'#ffefba'); grad.addColorStop(1,'#ffc371');
    ctx.fillStyle=grad; ctx.fillRect(0,0,1024,512);
    ctx.textAlign='center'; ctx.fillStyle='#3a0d0d';
    ctx.font='bold 70px Segoe UI'; ctx.fillText('Happy Deepavali to '+name,512,180);
    ctx.font='30px Segoe UI';
    ctx.fillText('May the light of Diwali fill your home with joy and prosperity.',512,250);
    ctx.fillText('Wishing you and your loved ones a bright and blessed Deepavali.✨',512,310);
    return new THREE.CanvasTexture(c);
  }

  function animate(){
    requestAnimationFrame(animate);
    t+=0.01;
    if(plane){plane.rotation.y=Math.sin(t)*0.5; plane.position.y=Math.sin(t*1.5)*0.05;}
    if(glow)glow.rotation.z+=0.002;
    if(particles){
      const p=particles.geometry.attributes.position;
      for(let i=0;i<p.count;i++){let y=p.getY(i)+0.002;if(y>1.2)y=-1.2;p.setY(i,y);}
      p.needsUpdate=true;
    }
    renderer.render(scene,cam3D);
  }

  function resize(){
    renderer.setSize(innerWidth,innerHeight);
    cam3D.aspect=innerWidth/innerHeight;
    cam3D.updateProjectionMatrix();
  }
  </script>
</body>
</html>
