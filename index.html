<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deepavali AR Wish ✨</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #000; font-family: system-ui, sans-serif;
    }
    #app { position: relative; height: 100vh; }
    #camera {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #gate {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      background: radial-gradient(circle at center, #1a0033 0%, #000 90%);
      color: white; z-index: 5;
    }
    input {
      padding: 10px; border-radius: 10px; border: none;
      width: 70%; font-size: 1rem; margin: 10px 0; text-align: center;
    }
    button {
      padding: 12px 20px; border: none; border-radius: 10px;
      background: linear-gradient(90deg,#ff8a00,#e52e71);
      color: #fff; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="gate">
      <h2>🪔 Happy Deepavali 🪔</h2>
      <p>Enter your name to receive your personalized AR wish:</p>
      <input id="userName" placeholder="Your name here" />
      <button id="start">Let the lights in ✨</button>
    </div>
    <audio id="bgm" loop preload="auto">
      <source src="https://cdn.pixabay.com/audio/2023/10/22/audio_ee4f78ef3f.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  const video = document.getElementById('camera');
  const gate = document.getElementById('gate');
  const startBtn = document.getElementById('start');
  const canvas = document.getElementById('overlay');
  const bgm = document.getElementById('bgm');

  let renderer, scene, camera3D, plane, glow, particles;
  let rotY = 0;

  startBtn.onclick = async () => {
    const name = document.getElementById('userName').value.trim() || "Friend";
    gate.style.display = 'none';
    await startCamera();
    startAR(name);
    playMusic();
    requestLocation();
  };

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }});
    video.srcObject = stream;
  }

  function playMusic() {
    bgm.volume = 0.5;
    bgm.play().catch(() => {
      console.log('Tap interaction needed to start music');
    });
  }

  function requestLocation() {
    if (!navigator.geolocation) {
      console.log('Geolocation not supported');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        console.log('Location:', pos.coords.latitude, pos.coords.longitude);
      },
      (err) => console.log('Location error:', err.message)
    );
  }

  function startAR(name) {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    scene = new THREE.Scene();
    camera3D = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera3D.position.z = 1.6;

    const tex = makeWishTexture(name);
    const geo = new THREE.PlaneGeometry(1.8, 0.7);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
    plane = new THREE.Mesh(geo, mat);
    plane.position.z = -1.2;
    scene.add(plane);

    // glowing ring
    const ringGeo = new THREE.RingGeometry(0.8, 1.1, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffc107, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
    glow = new THREE.Mesh(ringGeo, ringMat);
    glow.position.z = -1.3;
    scene.add(glow);

    // floating spark particles
    const pGeo = new THREE.BufferGeometry();
    const pCount = 120;
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      pPos[i * 3] = (Math.random() - 0.5) * 3;
      pPos[i * 3 + 1] = Math.random() * 2 - 1;
      pPos[i * 3 + 2] = -Math.random() * 2;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0xffe066, size: 0.02, transparent: true, opacity: 0.8 });
    particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    animate();
    window.addEventListener('resize', resize);
  }

  function makeWishTexture(name) {
    const c = document.createElement('canvas');
    c.width = 1024;
    c.height = 512;
    const ctx = c.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 1024, 512);
    grad.addColorStop(0, '#ffefba');
    grad.addColorStop(1, '#ffc371');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#3a0d0d';
    ctx.font = 'bold 70px Segoe UI';
    ctx.fillText('HAPPY DEEPAVALI', 512, 180);
    ctx.font = '30px Segoe UI';
    ctx.fillText('and may your days be filled with joy and light ✨', 512, 230);
    ctx.font = '36px Segoe UI';
    ctx.fillText('To: ' + name, 512, 310);
    ctx.fillText('From: Akash', 512, 370);
    return new THREE.CanvasTexture(c);
  }

  function animate() {
    requestAnimationFrame(animate);
    rotY += 0.01;
    if (plane) {
      plane.rotation.y = Math.sin(rotY) * 0.5;
      plane.position.y = Math.sin(Date.now() * 0.0015) * 0.05;
    }
    if (glow) glow.rotation.z += 0.002;
    if (particles) {
      const p = particles.geometry.attributes.position;
      for (let i = 0; i < p.count; i++) {
        let y = p.getY(i);
        y += 0.002;
        if (y > 1.2) y = -1.2;
        p.setY(i, y);
      }
      p.needsUpdate = true;
    }
    renderer.render(scene, camera3D);
  }

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera3D.aspect = window.innerWidth / window.innerHeight;
    camera3D.updateProjectionMatrix();
  }
  </script>
</body>
</html>
